<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurukul Learning</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Minimalist aesthetic for the AI Response Box */
        #lesson-container {
            display: none;
            background-color: #f4f1ea; /* Parchment */
            border-left: 4px solid #e2725b; /* Terra cotta */
            padding: 20px;
            margin-top: 20px;
            border-radius: 4px;
            color: #333;
            max-width: 600px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-red py-0 custom-glass-navbar" id="nav">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Gurukul Learning</a>
        </div>
    </nav>
    <iframe src="https://colorflow-embed.b-cdn.net/embed.html#e=_ouSSnLM" width="1600" height="1200" frameborder="0" id="bg" style="position: absolute; z-index: -1;"></iframe>
    
    <div class="page container mt-5">
        <div class="hele">
            <h1>Welcome Back,</h1>
        </div>
        
        <div class="choice mt-4">
            <h2>Choose a track to work</h2>
            <div class="choice-inputs d-flex gap-2" style="max-width: 400px;">
                <!-- Added IDs here -->
                <input type="text" id="topic-input" class="form-control" placeholder="Enter topic you want to learn">
                <button id="go-btn" class="btn btn-dark">Let's Go</button>
            </div>
        </div>

        <!-- This is where the AI Story will appear -->
        <div id="lesson-container">
            <h4 id="lesson-title"></h4>
            <p id="lesson-text"></p>
            <p><small class="text-muted" id="lesson-source"></small></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- The Engine: Connects Frontend to Django Backend -->
    <script>
        document.getElementById('go-btn').addEventListener('click', async () => {
            const topic = document.getElementById('topic-input').value;
            const btn = document.getElementById('go-btn');
            const container = document.getElementById('lesson-container');
            
            if (!topic) return;

            // Change button to loading state
            btn.innerText = "Tuning AI...";
            btn.disabled = true;

            try {
                // 1. Create the user profile in Django
                const onboardRes = await fetch('http://127.0.0.1:8000/api/onboard/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: "demo_student",
                        stated_age: 17,
                        domain: topic, // Passing the user's typed topic
                        inspiration: "",
                        dislikes: ""
                    })
                });
                
                // 2. Fetch the generated lesson from NVIDIA
                const lessonRes = await fetch('http://127.0.0.1:8000/api/lesson/demo_student/');
                const lessonData = await lessonRes.json();

                // 3. Display it on the screen
                document.getElementById('lesson-title').innerText = lessonData.title;
                document.getElementById('lesson-text').innerText = lessonData.lesson_text;
                document.getElementById('lesson-source').innerText = "Generated by: " + lessonData.source;
                container.style.display = "block";

            } catch (error) {
                alert("Error connecting to Gurukul API. Make sure Django is running!");
                console.error(error);
            } finally {
                btn.innerText = "Let's Go";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
